[package]
name = "dyson_sim_core"
version = "0.1.0"
edition = "2021"
authors = ["Kuro (Digital Familiar)", "Leon (S-tier Neuro-Architect)"]
description = "High-Speed Thermodynamic & Orbital Dyson Sphere Tick Simulator Core (Rust + PyO3)"

[lib]
name = "dyson_sim_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
